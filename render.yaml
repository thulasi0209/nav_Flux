services:
  # Backend Service
  - type: web
    name: robot-traffic-backend
    runtime: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Set this in the Render dashboard once the frontend service exists
      # (e.g. https://robot-traffic-frontend.onrender.com). Left as sync:false
      # instead of fromService to avoid a circular reference with the
      # frontend's own fromService pointing back at this service.
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: set a real secret value here (or in the Render dashboard)
      # to require X-API-Key on state-mutating routes. Leave unset for open/demo mode.
      - key: API_KEY
        sync: false

  # Frontend Service
  - type: static
    name: robot-traffic-frontend
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: robot-traffic-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
